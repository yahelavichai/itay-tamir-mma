<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="תודה שהשארתם פרטים! נחזור אליכם בהקדם!">
    <title>תודה| Team Tamir MMA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-dark: #0f0f0f;
            --secondary-dark: #1a1a1a;
            --accent-orange: #cf9985;
            --accent-red: #e63946;
            --text-white: #ffffff;
            --text-gray: #c0c0c0;
            --gradient-primary: linear-gradient(135deg, #ff6b35 0%, #e63946 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-white);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 107, 53, 0.2);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            direction: ltr;
        }

        .logo {
            height: 50px;
            filter: drop-shadow(0 0 10px rgba(255, 107, 53, 0.5));
        }

        .back-link {
            color: var(--accent-orange);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        /* Main Content */
        .main-content {
            padding: 120px 20px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .page-badge {
            display: inline-block;
            background: rgba(255, 107, 53, 0.1);
            color: var(--accent-orange);
            padding: 8px 25px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .page-title span {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-subtitle {
            color: var(--text-gray);
            font-size: 1.2rem;
        }

        /* Schedule Grid */
        .schedule-container {
            background: var(--secondary-dark);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 107, 53, 0.2);
            overflow-x: auto;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 2px;
            min-width: 900px;
        }

        .schedule-header {
            background: var(--gradient-primary);
            color: white;
            padding: 20px 15px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .time-slot {
            background: rgba(255, 107, 53, 0.1);
            padding: 15px;
            text-align: center;
            font-weight: 600;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .schedule-cell {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            min-height: 100px;
            transition: all 0.3s ease;
            position: relative;
        }

        .schedule-cell:hover {
            background: rgba(255, 107, 53, 0.05);
        }

        .session {
            background: var(--gradient-primary);
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.3);
            transition: all 0.3s ease;
        }

        .session:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.5);
        }

        .session-type {
            font-weight: 700;
            font-size: 1rem;
        }

        .session-info {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .session.private {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .session.private:hover {
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5);
        }

        .empty-slot {
            color: var(--text-gray);
            font-size: 0.85rem;
            text-align: center;
            opacity: 0.5;
        }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 30px;
            height: 30px;
            border-radius: 8px;
        }

        .legend-color.group {
            background: var(--gradient-primary);
        }

        .legend-color.private {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .legend-text {
            color: var(--text-gray);
            font-weight: 500;
        }

        /* CTA Section */
        .cta-section {
            text-align: center;
            margin-top: 60px;
            padding: 40px;
            background: var(--secondary-dark);
            border-radius: 20px;
            border: 1px solid rgba(255, 107, 53, 0.2);
        }

        .cta-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .cta-text {
            color: var(--text-gray);
            margin-bottom: 25px;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gradient-primary);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.6);
        }

        /* Notes */
        .notes {
            margin-top: 40px;
            padding: 25px;
            background: rgba(255, 107, 53, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 107, 53, 0.2);
        }

        .notes h3 {
            color: var(--accent-orange);
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .notes ul {
            list-style: none;
            padding: 0;
        }

        .notes li {
            color: var(--text-gray);
            padding: 8px 0;
            padding-right: 25px;
            position: relative;
        }

        .notes li::before {
            content: '•';
            position: absolute;
            right: 0;
            color: var(--accent-orange);
            font-weight: bold;
        }

        /* Footer */
        footer {
            background: var(--secondary-dark);
            padding: 30px 20px;
            text-align: center;
            margin-top: auto;
        }

        .footer-text {
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.2rem;
            }

            .schedule-container {
                padding: 15px;
            }

            .legend {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/">
                <img src="/logo.png" alt="Team Tamir MMA" class="logo">
            </a>
            <a href="/" class="back-link">
                חזרה לאתר הראשי
                <i class="fas fa-arrow-left"></i>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <div class="page-badge">✓ נשלח בהצלחה</div>
            <h1 class="page-title">תודה, <span>נחזור אליך בהקדם!</span></h1>
            <p class="page-subtitle">פרטיך התקבלו, נהיה בקשר בקרוב לקביעת אימון הניסיון.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p class="footer-text">© 2025 Team Tamir MMA | כל הזכויות שמורות</p>
    </footer>
</body>
</html>
